<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Finance Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">

  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; }
    header { background:#0078ff; color:#fff; padding:14px 20px; font-size:18px; }
    .container { padding:20px; max-width:900px; margin:auto; }
    .card { background:#fff; padding:18px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.08); margin-bottom:20px; }
    h2 { margin-top:0; }
    label { display:block; margin-top:10px; font-size:14px; }
    input, select, textarea {
      width:100%; padding:10px; margin-top:4px;
      border-radius:6px; border:1px solid #ccc; font-size:14px;
    }
    button {
      margin-top:14px; padding:12px 16px;
      background:#0078ff; color:#fff; border:none;
      border-radius:6px; cursor:pointer; font-size:15px;
    }
    button:hover { background:#005fcc; }
    .error { color:#c00; margin-top:10px; }
    .success { color:#0a7c2f; margin-top:10px; }
    ul { padding-left:18px; }
  </style>
</head>

<body>
<header>Personal Finance Tracker</header>

<div class="container">

  <!-- Backend connection -->
  <div class="card">
    <h2>Backend Connection</h2>

    <label>Apps Script Web App URL</label>
    <input id="backendUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec">

    <button id="saveBackendBtn">Save Backend URL</button>
    <div id="backendStatus" class="error"></div>
  </div>

  <!-- Add expense -->
  <div class="card">
    <h2>Add Expense</h2>

    <label>Amount</label>
    <input id="amount" type="number" step="0.01">

    <label>Category</label>
    <select id="category"></select>

    <label>Vendor</label>
    <input id="vendor" type="text">

    <label>Notes</label>
    <textarea id="notes" rows="2"></textarea>

    <button id="addExpenseBtn">Add Expense</button>
    <div id="addExpenseMsg" class="error"></div>
  </div>

  <!-- Recent expenses -->
  <div class="card">
    <h2>Recent Expenses</h2>
    <ul id="expenseList"></ul>
  </div>

</div>

<script>
  const backendStatus = document.getElementById("backendStatus");
  const backendInput = document.getElementById("backendUrl");
  const saveBackendBtn = document.getElementById("saveBackendBtn");

  const categorySelect = document.getElementById("category");
  const addExpenseBtn = document.getElementById("addExpenseBtn");
  const addExpenseMsg = document.getElementById("addExpenseMsg");
  const expenseList = document.getElementById("expenseList");

  function getBackendUrl() {
    return localStorage.getItem("backendUrl") || "";
  }

  function setBackendUrl(url) {
    localStorage.setItem("backendUrl", url);
  }

  function showBackendStatus(msg, ok = false) {
    backendStatus.textContent = msg;
    backendStatus.className = ok ? "success" : "error";
  }

  /* ⭐ FIXED: Apps Script-safe ping function */
  async function pingBackend(url) {
    let res;
    try {
      res = await fetch(url + "?action=ping");
    } catch (e) {
      throw new Error("No response");
    }

    const text = await res.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("Backend returned non‑JSON response");
    }

    if (data.backend !== "custom") {
      throw new Error("Backend not in custom mode");
    }
  }

  saveBackendBtn.addEventListener("click", async () => {
    const url = backendInput.value.trim();
    if (!url) {
      showBackendStatus("Please enter a backend URL");
      return;
    }
    showBackendStatus("Checking backend...");
    try {
      await pingBackend(url);
      setBackendUrl(url);
      showBackendStatus("Backend saved and verified", true);
      await loadCategories();
      await loadRecentExpenses();
    } catch (e) {
      showBackendStatus("Could not verify backend: " + e.message);
    }
  });

  async function loadCategories() {
    const url = getBackendUrl();
    if (!url) return;
    categorySelect.innerHTML = "";
    try {
      const res = await fetch(url + "?action=getCategories");
      const data = await res.json();
      (data.categories || []).forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });
    } catch {}
  }

  addExpenseBtn.addEventListener("click", async () => {
    const url = getBackendUrl();
    if (!url) {
      addExpenseMsg.textContent = "Set backend URL first.";
      return;
    }

    const amount = parseFloat(document.getElementById("amount").value);
    const category = categorySelect.value;
    const vendor = document.getElementById("vendor").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!amount || !category) {
      addExpenseMsg.textContent = "Amount and category are required.";
      return;
    }

    addExpenseMsg.textContent = "Saving...";
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addExpense",
          data: { amount, category, vendor, notes }
        })
      });

      const data = await res.json();

      if (data.status === "ok") {
        addExpenseMsg.textContent = "Expense added.";
        addExpenseMsg.className = "success";
        document.getElementById("amount").value = "";
        document.getElementById("vendor").value = "";
        document.getElementById("notes").value = "";
        await loadRecentExpenses();
      } else {
        addExpenseMsg.textContent = "Backend error.";
      }
    } catch {
      addExpenseMsg.textContent = "Failed to add expense.";
    }
  });

  async function loadRecentExpenses() {
    const url = getBackendUrl();
    if (!url) return;
    expenseList.innerHTML = "";
    try {
      const res = await fetch(url + "?action=getExpenses&limit=10");
      const data = await res.json();
      (data.expenses || []).forEach(e => {
        const li = document.createElement("li");
        li.textContent = `${e.date} – ${e.category} – ${e.amount} – ${e.vendor || ""}`;
        expenseList.appendChild(li);
      });
    } catch {}
  }

  window.addEventListener("load", async () => {
    const url = getBackendUrl();
    if (url) {
      backendInput.value = url;
      showBackendStatus("Using saved backend URL", true);
      await loadCategories();
      await loadRecentExpenses();
    }
  });
</script>

</body>
</html>
