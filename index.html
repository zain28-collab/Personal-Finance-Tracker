<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Finance Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; }
    header { background:#0078ff; color:#fff; padding:12px 20px; }
    .container { padding:20px; max-width:900px; margin:auto; }
    .row { display:flex; gap:20px; flex-wrap:wrap; }
    .card { background:#fff; padding:16px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.08); flex:1; min-width:260px; }
    h2 { margin-top:0; }
    label { display:block; margin-top:8px; font-size:14px; }
    input, select, textarea { width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
    button { margin-top:12px; padding:10px 14px; border:none; border-radius:6px; background:#0078ff; color:#fff; cursor:pointer; font-size:14px; }
    button:disabled { background:#999; cursor:not-allowed; }
    .error { color:#c00; margin-top:8px; }
    .success { color:#0a7c2f; margin-top:8px; }
    ul { padding-left:18px; }
  </style>
</head>
<body>
<header>
  <strong>Personal Finance Tracker</strong>
</header>

<div class="container">
  <!-- Backend connection -->
  <div class="card">
    <h2>Backend Connection</h2>
    <label for="backendUrl">Apps Script Web App URL</label>
    <input id="backendUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="saveBackendBtn">Save Backend URL</button>
    <div id="backendStatus" class="error"></div>
  </div>

  <div class="row">
    <!-- Add expense -->
    <div class="card">
      <h2>Add Expense</h2>
      <label for="amount">Amount</label>
      <input id="amount" type="number" step="0.01">

      <label for="category">Category</label>
      <select id="category"></select>

      <label for="vendor">Vendor</label>
      <input id="vendor" type="text">

      <label for="notes">Notes</label>
      <textarea id="notes" rows="2"></textarea>

      <button id="addExpenseBtn">Add Expense</button>
      <div id="addExpenseMsg" class="error"></div>
    </div>

    <!-- Recent expenses -->
    <div class="card">
      <h2>Recent Expenses</h2>
      <ul id="expenseList"></ul>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
